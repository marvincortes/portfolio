<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>404 - Page Not Found</title>

  <!-- Auto redirect -->
  <meta http-equiv="refresh" content="3; url=/" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .box {
      max-width: 500px;
      padding: 20px;
    }

    h1 {
      font-size: 6rem;
      margin: 0;
      color: #60a5fa;
    }

    h2 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    p {
      opacity: 0.8;
      margin-bottom: 20px;
    }

    a {
      display: inline-block;
      padding: 10px 18px;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    a:hover {
      background: #2563eb;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>You’ll be redirected to the homepage in 3 seconds.</p>

    <a href="/">Go Home Now</a>
  </div>
</body>
</html>
